<!doctype html>

<head>
	<meta http-equiv="Content-Security-Policy" content="default-src 'self' data: blob:; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: http: https:; media-src 'self' data: blob: http: https:; connect-src 'self' ws: wss: http: https:; object-src 'none'; base-uri 'self'" />
	<meta charset="UTF-8" />
	<!-- 不自动检查电话号码 -->
	<meta name="format-detection" content="telephone=no" />
	<!-- 手机端网页不显示地址栏 -->
	<meta name="mobile-web-app-capable" content="yes" />
	<!-- 禁止缩放 手机端全屏 -->
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
	<title>无名杀</title>
	<style>
		#startup-loading {
			position: fixed;
			inset: 0;
			z-index: 2147483647;
			display: flex;
			align-items: center;
			justify-content: center;
			background: radial-gradient(ellipse at center, #303329, #171913 75%);
			color: #f2e6c9;
			font:
				16px/1.6 "Microsoft YaHei",
				"PingFang SC",
				sans-serif;
			text-align: center;
		}
		#startup-loading[hidden] {
			display: none;
		}
		#startup-loading .startup-panel {
			position: static;
			width: min(360px, 80vw);
			height: auto;
			padding: 24px;
			box-sizing: border-box;
		}
		#startup-loading h1 {
			margin: 0 0 28px;
			color: #dec48d;
			font: 32px/1.5 serif;
			letter-spacing: 8px;
		}
		#startup-loading progress {
			display: block;
			appearance: none;
			-webkit-appearance: none;
			width: 100%;
			height: 8px;
			border: 1px solid #9c8151;
			border-radius: 4px;
			overflow: hidden;
			background: #11150f;
			accent-color: #cfb073;
		}
		#startup-loading progress::-webkit-progress-bar {
			background: #11150f;
		}
		#startup-loading progress::-webkit-progress-value {
			background: linear-gradient(90deg, #8d713e, #e1c992);
		}
		#startup-loading progress::-moz-progress-bar {
			background: #cfb073;
		}
		#startup-loading .startup-percent {
			margin: 12px 0 4px;
			color: #dec48d;
		}
		#startup-loading .startup-status {
			min-height: 48px;
			margin: 0;
			font-size: 13px;
			color: #b6b6a5;
		}
		#startup-loading button {
			position: static;
			margin-top: 16px;
			padding: 6px 18px;
			border: 1px solid #9c8151;
			border-radius: 4px;
			background: #303329;
			color: #f2e6c9;
			font: inherit;
			cursor: pointer;
		}
	</style>
	<script src="./recovery.js"></script>
	<script type="module" src="./bootstrap.js"></script>
</head>
<body>
	<section id="startup-loading" aria-label="游戏加载">
		<div class="startup-panel">
			<h1>无名杀</h1>
			<progress max="100" value="0" aria-label="预加载进度"></progress>
			<p class="startup-percent">0%</p>
			<p class="startup-status" role="status">正在加载游戏</p>
			<button type="button" hidden id="startup-retry">重新加载</button>
			<button type="button" hidden id="startup-diagnostics">复制诊断</button>
		</div>
	</section>
</body>
