<!doctype html>

<head>
	<meta http-equiv="Content-Security-Policy" content="default-src 'self' data: blob:; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: http: https:; media-src 'self' data: blob: http: https:; connect-src 'self' ws: wss: http: https:; object-src 'none'; base-uri 'self'" />
	<meta charset="UTF-8" />
	<!-- 不自动检查电话号码 -->
	<meta name="format-detection" content="telephone=no" />
	<!-- 手机端网页不显示地址栏 -->
	<meta name="mobile-web-app-capable" content="yes" />
	<!-- 禁止缩放 手机端全屏 -->
	<meta name="viewport" content="user-scalable=no, viewport-fit=cover" />
	<title>无名杀</title>
	<style>
		#startup-loading {
			position: fixed;
			inset: 0;
			z-index: 2147483647;
			display: flex;
			align-items: center;
			justify-content: center;
			background: radial-gradient(ellipse at center, #303329, #171913 75%);
			color: #f2e6c9;
			font:
				16px/1.6 "Microsoft YaHei",
				"PingFang SC",
				sans-serif;
			text-align: center;
		}
		#startup-loading[hidden] {
			display: none;
		}
		#startup-loading .startup-panel {
			position: static;
			width: min(360px, 80vw);
			height: auto;
			padding: 24px;
			box-sizing: border-box;
		}
		#startup-loading h1 {
			margin: 0 0 28px;
			color: #dec48d;
			font: 32px/1.5 serif;
			letter-spacing: 8px;
		}
		#startup-loading progress {
			display: block;
			appearance: none;
			-webkit-appearance: none;
			width: 100%;
			height: 8px;
			border: 1px solid #9c8151;
			border-radius: 4px;
			overflow: hidden;
			background: #11150f;
			accent-color: #cfb073;
		}
		#startup-loading progress::-webkit-progress-bar {
			background: #11150f;
		}
		#startup-loading progress::-webkit-progress-value {
			background: linear-gradient(90deg, #8d713e, #e1c992);
		}
		#startup-loading progress::-moz-progress-bar {
			background: #cfb073;
		}
		#startup-loading .startup-percent {
			margin: 12px 0 4px;
			color: #dec48d;
		}
		#startup-loading .startup-status {
			min-height: 48px;
			margin: 0;
			font-size: 13px;
			color: #b6b6a5;
		}
		#startup-loading button {
			position: static;
			margin-top: 16px;
			padding: 6px 18px;
			border: 1px solid #9c8151;
			border-radius: 4px;
			background: #303329;
			color: #f2e6c9;
			font: inherit;
			cursor: pointer;
		}
	</style>
	<script>
		"use strict";
		(() => {
			window.onerror = function (msg, src, line, column, err) {
				let str = `错误文件: ${typeof src == "string" && src.length > 0 ? decodeURI(src) : "未知文件"}`;
				str += `\n错误信息: ${msg}`;
				str += `\n行号: ${line}`;
				str += `\n列号: ${column}`;
				if (err && err.stack) str += "\n" + decodeURI(err.stack);
				console.error(str);
				alert(str);
			};
			const STACK_REGEXP = /^\s*at .*(\S+:\d+|\(native\))/m;
			const errorList = [];
			function extractLocation(urlLike) {
				// 不存在地址信息的字符串
				if (!/:/.test(urlLike)) {
					return [urlLike];
				}

				// 捕获位置用到的正则
				const regExp = /(.+?)(?::(\d+))?(?::(\d+))?$/;
				const parts = regExp.exec(urlLike.replace(/[()]/g, ""));

				// @ts-ignore
				return [parts[1], parts[2] || void 0, parts[3] || void 0];
			}
			window.onunhandledrejection = async event => {
				event.promise.catch(error => {
					console.log(error);
					// 如果`error`是个错误，则继续处理
					if (error instanceof Error) {
						// 如果已经处理过该错误，则不再处理
						if (errorList.includes(error)) return;
						errorList.push(error);
						// 如果`error`拥有字符串形式的报错栈堆，且报错栈堆确实符合v8的stack
						if (typeof error.stack === "string" && STACK_REGEXP.test(error.stack)) {
							// 获取符合栈堆信息的字符串，一般来说就是从第二行开始的所有行
							// 为了处理eval的情况，故必须获取完行数
							let lines = error.stack.split("\n").filter(line => STACK_REGEXP.test(line));

							// 提供类型信息防止vscode报错
							/**
							 * @type {string | undefined}
							 */
							let fileName = void 0;

							/**
							 * @type {number | undefined}
							 */
							let line = void 0;

							/**
							 * @type {number | undefined}
							 */
							let column = void 0;

							// 从第一条开始遍历，一直遍历到不存在eval的位置
							for (let currentLine = 0; currentLine < lines.length; ++currentLine) {
								if (/\(eval /.test(lines[currentLine])) continue;

								let formatedLine = lines[currentLine]
									.replace(/^\s+/, "")
									.replace(/\(eval code/g, "(")
									.replace(/^.*?\s+/, "");

								const location = formatedLine.match(/ (\(.+\)$)/);
								if (location) formatedLine = formatedLine.replace(location[0], "");

								const locationParts = extractLocation(location ? location[1] : formatedLine);

								fileName = ["eval", "<anonymous>"].includes(locationParts[0]) ? void 0 : locationParts[0];
								line = Number(locationParts[1]);
								column = Number(locationParts[2]);
								break;
							}

							// @ts-ignore
							window.onerror(error.message, fileName, line, column, error);
						}
						// 反之我们只能不考虑报错文件信息，直接调用onerror
						else {
							try {
								// @ts-ignore
								let [_, src = void 0, line = void 0, column = void 0] = /at\s+.*\s+\((.*):(\d*):(\d*)\)/i.exec(error.stack.split("\n")[1]);
								if (typeof line == "string") line = Number(line);
								if (typeof column == "string") column = Number(column);
								// @ts-ignore
								window.onerror(error.message, src, line, column, error);
							} catch (e) {
								window.onerror(error.message, "", 0, 0, error);
							}
						}
					}
				});
			};
		})();
	</script>
	<script type="module" src="./noname/entry.ts"></script>
</head>
<body>
	<section id="startup-loading" aria-label="游戏加载">
		<div class="startup-panel">
			<h1>无名杀</h1>
			<progress max="100" value="0" aria-label="预加载进度"></progress>
			<p class="startup-percent">0%</p>
			<p class="startup-status" role="status">正在加载游戏</p>
			<button type="button" hidden onclick="window.location.reload()">重新加载</button>
		</div>
	</section>
</body>
