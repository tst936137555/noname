name: Build

on:
    push:
        branches: [main]

permissions:
    contents: read

jobs:
    build:
        name: Build
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v6

            - name: Install pnpm
              uses: pnpm/action-setup@v5
              with:
                  version: 10
                  run_install: false

            - name: Install Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: "pnpm"

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Run tests
              run: |
                  pnpm test
                  pnpm check:types

            - name: Run Build
              env:
                  NONAME_BUILD_CHANNEL: test
                  NONAME_BUILD_COMMIT: ${{ github.sha }}
              run: pnpm build

            - name: Verify distribution resources
              # Validate the same complete directory that is uploaded.
              run: pnpm verify:assets

            - name: Build desktop preload and smoke test
              run: |
                  pnpm -F @noname/electron build
                  SANDBOX_FILE=$(node -p "require('node:path').join(require('node:path').dirname(require('./apps/electron/node_modules/electron')), 'chrome-sandbox')")
                  test -f "$SANDBOX_FILE"
                  sudo chown root:root "$SANDBOX_FILE"
                  sudo chmod 4755 "$SANDBOX_FILE"
                  xvfb-run -a pnpm test:browser

            - name: Upload build artifact
              uses: actions/upload-artifact@v7
              with:
                  name: noname-${{ github.sha }}
                  path: dist
                  include-hidden-files: true
                  retention-days: 7
