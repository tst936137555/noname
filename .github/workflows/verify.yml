name: Verify Distribution

on:
    pull_request:
        branches: [main]
    workflow_call:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    verify:
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@v6
            - uses: pnpm/action-setup@v5
              with:
                  version: 10
            - uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - name: Check engineering boundaries
              run: |
                  pnpm test
                  pnpm lint
                  pnpm lint:engineering
                  pnpm check:platforms
                  pnpm check:types
            - name: Build and verify full distribution
              run: |
                  pnpm build
                  pnpm verify:assets
                  pnpm -F @noname/electron build
                  SANDBOX_FILE=$(node -p "require('node:path').join(require('node:path').dirname(require('./apps/electron/node_modules/electron')), 'chrome-sandbox')")
                  test -f "$SANDBOX_FILE"
                  sudo chown root:root "$SANDBOX_FILE"
                  sudo chmod 4755 "$SANDBOX_FILE"
                  xvfb-run -a pnpm test:browser
            - name: Preserve verification diagnostics
              if: always()
              uses: actions/upload-artifact@v7
              with:
                  name: verification-${{ github.sha }}
                  path: |
                      output/type-diagnostics.txt
                      output/browser-metrics.json
                  retention-days: 7
